<section class="container-search">
  <div class="container-search__content">
    <input
      class="container-search__content-input-search"
      type="search"
      id="search"
      placeholder="Pesquisar..."
      [formControl]="searchTerm"
      aria-label="Pesquisar produtos"
    />
    <span class="container-search__content-icon">
      <img src="/assets/icons/search.svg" alt="Ícone de pesquisa">
    </span>
  </div>
</section>

<section class="container-card">
  <div class="content-card">
    @if (filteredProducts$ | async; as products) {
      @if (products.length) {
        @for(product of products; track product.id) {
          @defer (on immediate) {
            <app-card
              [product]="product"
              (onDelete)="handleOnDelete(product.id)"
            />
          }
        }
      } @else {
        <p>Nenhum produto encontrado para a busca realizada</p>
      }
    } @else {
      <p>Carregando produtos...</p>
    }
  </div>
</section>
